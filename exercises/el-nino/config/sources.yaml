# ---------------------------------------------------------------------------
# Source registry. Everything the pipeline polls is declared here.
# Adding a source = adding a block here + a connector class registered under
# the same `connector` key. No core code changes required.
#
# auth:
#   none      -> works with zero credentials (implemented + live)
#   key       -> needs an API key / account; client is implemented and tested
#                against the documented contract but stays dormant until the
#                matching env var is present.
# cadence: cron expression, UTC.
# ---------------------------------------------------------------------------
version: 4

# ---------------------------------------------------------------------------
# Removed 2026-07-28, after the first fully live run. These eleven were
# `generic_http_json` stubs pointed at human-readable web pages rather than at
# machine-readable endpoints, so they could never have succeeded and produced
# eleven identical failures every run. A permanent failure that no one intends
# to fix is noise, and noise is what makes an operator stop reading the alert
# strip -- the same reason the alert tiers exist.
#
#   jma, chirps, speibase, fao_giews, amis, geoglam,
#   senamhi_peru, bmkg_indonesia, imarpe_anchoveta, ipc, fews_net
#
# What their removal costs, stated so it is not silently forgotten:
#   * senamhi_peru / bmkg_indonesia -- national met services for the two
#     priority regions. Their absence is why Peru and Indonesia are modelled
#     from teleconnection composites rather than observed locally.
#   * imarpe_anchoveta -- the fisheries chain is now entirely config-anchored
#     on 1997-98 with no live biomass or quota input.
#   * ipc / fews_net -- no food-insecurity phase data at all.
#   * chirps / speibase / geoglam -- no observed precipitation, drought index
#     or crop-condition input; those layers stay composite-derived.
#
# iri_plume and usda_wasde were kept deliberately. Both are real endpoints
# that returned 404 and 403 rather than the wrong content type, so both are
# worth retrying and worth a proper client.
# ---------------------------------------------------------------------------

defaults:
  timeout_s: 45
  retries: 3
  backoff_s: 5
  user_agent: "enso-tracker/1.0 (research; contact: ops@example.org)"
  stale_after_h: 36        # beyond this, last-good is served with stale=true

climate:
  cpc_oni:
    connector: cpc_oni
    auth: none
    # Two wrong URLs in a row for this one source. 'origin.cpc...' did not
    # resolve at all. ONI_v5.php resolves, returns 200, and is the *wide*
    # layout (one row per year, twelve season columns) while the parser expects
    # the long one -- so it failed with '0 usable rows', which reads like a
    # dead source rather than a mismatched shape. oni.ascii.txt is the long
    # SEAS/YR/TOTAL/ANOM form the parser was written for, and carries the
    # absolute SST as well as the anomaly.
    url: https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt
    cadence: "0 15 * * 4"          # CPC updates monthly, Thursday release window
    description: Oceanic Nino Index, ERSSTv5, 3-month running mean, era-specific climatology
    units: degC
    variables: [oni]

  cpc_weekly_nino:
    connector: cpc_weekly
    auth: none
    # wksst8110.for is the OLD 1981-2010 base-period file. CPC froze it when it
    # moved to the 1991-2020 climatology, so it kept serving happily and kept
    # returning 2020 data. Caught by the observation-age alarm, not by the
    # connector -- which is why that alarm exists.
    url: https://www.cpc.ncep.noaa.gov/data/indices/wksst9120.for
    cadence: "0 18 * * 1"          # weekly, Monday
    description: Weekly Nino 1+2 / 3 / 3.4 / 4 SST and anomalies
    units: degC
    variables: [nino12, nino3, nino34, nino4]

  cpc_ersstv5_monthly:
    connector: cpc_ersst
    auth: none
    url: https://psl.noaa.gov/data/correlation/nina34.anom.data
    cadence: "0 06 5 * *"
    description: Monthly Nino 3.4 anomaly, ERSSTv5
    units: degC
    variables: [nino34_anom]

  iri_plume:
    connector: iri_plume
    auth: none
    # KEPT AS A RECORD, EXPECTED TO FAIL. Checked 2026-07-28: IRI has withdrawn
    # public forecast data. Their current ENSO page states "We are no longer
    # providing forecast data" and offers a collaboration form instead. This is
    # not a moved endpoint and there is no client to write -- the 404 is the
    # correct answer to the question we are asking.
    #
    # It stays in the registry because the plume is the single largest gap in
    # this tracker, and a source that silently disappears from a config is a
    # gap nobody re-examines. The replacement route is Copernicus C3S
    # (`copernicus_c3s` below), which needs a free credential rather than code.
    url: https://iri.columbia.edu/our-expertise/climate/forecasts/enso/current/
    cadence: "0 16 19 * *"         # IRI/CPC plume, ~19th monthly
    description: IRI/CPC dynamical + statistical model plume
    units: degC
    variables: [nino34_forecast]

  nmme:
    connector: nmme_thredds
    auth: key
    env: [NMME_THREDDS_USER, NMME_THREDDS_PASS]   # optional; public THREDDS often open
    url: https://www.esrl.noaa.gov/psd/thredds/dodsC/Datasets/NMME
    cadence: "0 00,12 * * *"
    description: North American Multi-Model Ensemble, per-member Nino 3.4
    units: degC
    variables: [sst_anom]
    members_expected: 6            # model count contributing to the 667-member pool

  copernicus_c3s:
    connector: cds_seasonal
    auth: key
    env: [CDSAPI_URL, CDSAPI_KEY]
    dataset: seasonal-monthly-single-levels
    cadence: "0 00,12 * * *"
    description: C3S multi-system seasonal forecast (7 centres)
    units: K
    variables: [sea_surface_temperature, total_precipitation, 2m_temperature]
    members_expected: 7

  ecmwf_seas5:
    connector: cds_seasonal
    auth: key
    env: [CDSAPI_URL, CDSAPI_KEY]
    dataset: seasonal-monthly-single-levels
    originating_centre: ecmwf
    cadence: "0 00 6 * *"
    description: ECMWF SEAS5
    units: K
    variables: [sea_surface_temperature]

  jamstec_sintex:
    connector: generic_http_grib
    auth: key
    env: [JAMSTEC_TOKEN]
    url: https://www.jamstec.go.jp/aplinfo/sintexf/
    cadence: "0 03 15 * *"
    description: SINTEX-F seasonal prediction system
    units: degC
    variables: [nino34]

  bom_access_s:
    connector: generic_http_json
    auth: key
    env: [BOM_API_KEY]
    url: http://www.bom.gov.au/climate/ocean/outlooks/
    cadence: "0 02 * * 2"
    description: Bureau of Meteorology ACCESS-S2
    units: degC
    variables: [nino34]

geospatial:
  era5:
    connector: cds_reanalysis
    auth: key
    env: [CDSAPI_URL, CDSAPI_KEY]
    dataset: reanalysis-era5-single-levels-monthly-means
    cadence: "0 08 7 * *"
    description: ERA5 monthly means for temperature/precip anomaly baselines
    units: K
    variables: [2m_temperature, total_precipitation]

  modis_vhi:
    connector: generic_http_json
    auth: key
    env: [EARTHDATA_TOKEN]
    url: https://www.star.nesdis.noaa.gov/smcd/emb/vci/VH/
    cadence: "0 10 * * 3"
    description: Vegetation Health Index / NDVI
    units: index
    variables: [vhi, ndvi]

  gfas_fire:
    connector: cds_atmosphere
    auth: key
    env: [ADSAPI_URL, ADSAPI_KEY]
    dataset: cams-global-fire-emissions-gfas
    cadence: "0 11 * * *"
    description: GFAS fire radiative power and emissions
    units: W m-2
    variables: [frpfire]

agriculture:
  usda_wasde:
    connector: usda_wasde
    auth: none
    url: https://www.usda.gov/oce/commodity/wasde
    cadence: "0 17 12 * *"
    description: USDA World Agricultural Supply and Demand Estimates
    variables: [production, yield, ending_stocks]

  usda_quickstats:
    connector: generic_http_json
    auth: key
    env: [USDA_NASS_KEY]
    url: https://quickstats.nass.usda.gov/api
    cadence: "0 17 * * 2"
    description: USDA NASS QuickStats
    variables: [yield, area, production]

markets:
  worldbank_pinksheet:
    connector: worldbank_pinksheet
    auth: none
    url: https://thedocs.worldbank.org/en/doc/5d903e848db1d1b83e0ec8f744e55570-0350012021/related/CMO-Historical-Data-Monthly.xlsx
    cadence: "0 12 2 * *"
    description: World Bank Pink Sheet monthly nominal commodity prices
    units: usd
    variables: [price]

  yahoo_futures:
    connector: yahoo_futures
    auth: none
    url: https://query1.finance.yahoo.com/v8/finance/chart/
    cadence: "*/30 13-21 * * 1-5"
    description: Continuous front-month futures settlements
    units: native
    variables: [close, volume]

  twelve_data:
    connector: generic_http_json
    auth: key
    env: [TWELVE_DATA_KEY]
    url: https://api.twelvedata.com/time_series
    cadence: "*/15 * * * 1-5"
    description: Backup/intraday market feed
    variables: [close]

  cme_settlements:
    connector: generic_http_json
    auth: key
    env: [CME_API_KEY]
    url: https://www.cmegroup.com/services/
    cadence: "0 22 * * 1-5"
    description: CBOT/CME official settlements and forward curve
    variables: [settle, open_interest]

  ice_settlements:
    connector: generic_http_json
    auth: key
    env: [ICE_API_KEY]
    url: https://www.theice.com/marketdata/
    cadence: "0 22 * * 1-5"
    description: ICE softs (coffee, cocoa, sugar) settlements
    variables: [settle]

  bursa_malaysia:
    connector: generic_http_json
    auth: key
    env: [BURSA_API_KEY]
    url: https://www.bursamalaysia.com/
    cadence: "0 11 * * 1-5"
    description: FCPO crude palm oil futures
    units: myr
    variables: [settle]

