# ---------------------------------------------------------------------------
# Source registry. Everything the pipeline polls is declared here.
# Adding a source = adding a block here + a connector class registered under
# the same `connector` key. No core code changes required.
#
# auth:
#   none      -> works with zero credentials (implemented + live)
#   key       -> needs an API key / account; client is implemented and tested
#                against the documented contract but stays dormant until the
#                matching env var is present.
# cadence: cron expression, UTC.
# ---------------------------------------------------------------------------
version: 3

defaults:
  timeout_s: 45
  retries: 3
  backoff_s: 5
  user_agent: "enso-tracker/1.0 (research; contact: ops@example.org)"
  stale_after_h: 36        # beyond this, last-good is served with stale=true

climate:
  cpc_oni:
    connector: cpc_oni
    auth: none
    url: https://origin.cpc.ncep.noaa.gov/products/analysis_monitoring/ensostuff/ONI_v5.php
    cadence: "0 15 * * 4"          # CPC updates monthly, Thursday release window
    description: Oceanic Nino Index, ERSSTv5, 3-month running mean, era-specific climatology
    units: degC
    variables: [oni]

  cpc_weekly_nino:
    connector: cpc_weekly
    auth: none
    url: https://www.cpc.ncep.noaa.gov/data/indices/wksst8110.for
    cadence: "0 18 * * 1"          # weekly, Monday
    description: Weekly Nino 1+2 / 3 / 3.4 / 4 SST and anomalies
    units: degC
    variables: [nino12, nino3, nino34, nino4]

  cpc_ersstv5_monthly:
    connector: cpc_ersst
    auth: none
    url: https://psl.noaa.gov/data/correlation/nina34.anom.data
    cadence: "0 06 5 * *"
    description: Monthly Nino 3.4 anomaly, ERSSTv5
    units: degC
    variables: [nino34_anom]

  iri_plume:
    connector: iri_plume
    auth: none
    url: https://iri.columbia.edu/our-expertise/climate/forecasts/enso/current/
    cadence: "0 16 19 * *"         # IRI/CPC plume, ~19th monthly
    description: IRI/CPC dynamical + statistical model plume
    units: degC
    variables: [nino34_forecast]

  nmme:
    connector: nmme_thredds
    auth: key
    env: [NMME_THREDDS_USER, NMME_THREDDS_PASS]   # optional; public THREDDS often open
    url: https://www.esrl.noaa.gov/psd/thredds/dodsC/Datasets/NMME
    cadence: "0 00,12 * * *"
    description: North American Multi-Model Ensemble, per-member Nino 3.4
    units: degC
    variables: [sst_anom]
    members_expected: 6            # model count contributing to the 667-member pool

  copernicus_c3s:
    connector: cds_seasonal
    auth: key
    env: [CDSAPI_URL, CDSAPI_KEY]
    dataset: seasonal-monthly-single-levels
    cadence: "0 00,12 * * *"
    description: C3S multi-system seasonal forecast (7 centres)
    units: K
    variables: [sea_surface_temperature, total_precipitation, 2m_temperature]
    members_expected: 7

  ecmwf_seas5:
    connector: cds_seasonal
    auth: key
    env: [CDSAPI_URL, CDSAPI_KEY]
    dataset: seasonal-monthly-single-levels
    originating_centre: ecmwf
    cadence: "0 00 6 * *"
    description: ECMWF SEAS5
    units: K
    variables: [sea_surface_temperature]

  jamstec_sintex:
    connector: generic_http_grib
    auth: key
    env: [JAMSTEC_TOKEN]
    url: https://www.jamstec.go.jp/aplinfo/sintexf/
    cadence: "0 03 15 * *"
    description: SINTEX-F seasonal prediction system
    units: degC
    variables: [nino34]

  bom_access_s:
    connector: generic_http_json
    auth: key
    env: [BOM_API_KEY]
    url: http://www.bom.gov.au/climate/ocean/outlooks/
    cadence: "0 02 * * 2"
    description: Bureau of Meteorology ACCESS-S2
    units: degC
    variables: [nino34]

  jma:
    connector: generic_http_json
    auth: none
    url: https://ds.data.jma.go.jp/tcc/tcc/products/elnino/index/
    cadence: "0 04 12 * *"
    description: JMA ENSO monitoring indices
    units: degC
    variables: [nino3]

geospatial:
  chirps:
    connector: chirps
    auth: none
    url: https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_monthly/tifs/
    cadence: "0 07 8 * *"
    description: CHIRPS v2 monthly precipitation, 0.05 deg
    units: mm
    variables: [precip]

  era5:
    connector: cds_reanalysis
    auth: key
    env: [CDSAPI_URL, CDSAPI_KEY]
    dataset: reanalysis-era5-single-levels-monthly-means
    cadence: "0 08 7 * *"
    description: ERA5 monthly means for temperature/precip anomaly baselines
    units: K
    variables: [2m_temperature, total_precipitation]

  speibase:
    connector: generic_netcdf
    auth: none
    url: https://digital.csic.es/handle/10261/153475
    cadence: "0 09 10 * *"
    description: SPEIbase drought index
    units: sigma
    variables: [spei03, spei06, spei12]

  modis_vhi:
    connector: generic_http_json
    auth: key
    env: [EARTHDATA_TOKEN]
    url: https://www.star.nesdis.noaa.gov/smcd/emb/vci/VH/
    cadence: "0 10 * * 3"
    description: Vegetation Health Index / NDVI
    units: index
    variables: [vhi, ndvi]

  gfas_fire:
    connector: cds_atmosphere
    auth: key
    env: [ADSAPI_URL, ADSAPI_KEY]
    dataset: cams-global-fire-emissions-gfas
    cadence: "0 11 * * *"
    description: GFAS fire radiative power and emissions
    units: W m-2
    variables: [frpfire]

agriculture:
  fao_giews:
    connector: generic_http_json
    auth: none
    url: https://www.fao.org/giews/en/
    cadence: "0 05 * * 1"
    description: FAO GIEWS country briefs and price warnings
    variables: [alert_status, price_warning]

  amis:
    connector: generic_http_json
    auth: none
    url: https://app.amis-outlook.org/
    cadence: "0 05 * * 1"
    description: AMIS Market Monitor supply/demand balances
    variables: [production, stocks, stock_to_use]

  usda_wasde:
    connector: usda_wasde
    auth: none
    url: https://www.usda.gov/oce/commodity/wasde
    cadence: "0 17 12 * *"
    description: USDA World Agricultural Supply and Demand Estimates
    variables: [production, yield, ending_stocks]

  usda_quickstats:
    connector: generic_http_json
    auth: key
    env: [USDA_NASS_KEY]
    url: https://quickstats.nass.usda.gov/api
    cadence: "0 17 * * 2"
    description: USDA NASS QuickStats
    variables: [yield, area, production]

  geoglam:
    connector: generic_http_json
    auth: none
    url: https://cropmonitor.org/
    cadence: "0 12 5 * *"
    description: GEOGLAM Crop Monitor conditions
    variables: [crop_condition]

  senamhi_peru:
    connector: generic_http_json
    auth: none
    url: https://www.senamhi.gob.pe/
    cadence: "0 13 * * 1"
    description: Peru national met service bulletins (ENFEN coastal El Nino index)
    variables: [icen, coastal_alert]

  bmkg_indonesia:
    connector: generic_http_json
    auth: none
    url: https://www.bmkg.go.id/
    cadence: "0 13 * * 1"
    description: Indonesia BMKG climate outlook and hotspot bulletins
    variables: [rainfall_outlook, hotspots]

  imarpe_anchoveta:
    connector: generic_http_json
    auth: none
    url: https://www.gob.pe/imarpe
    cadence: "0 14 * * 1"
    description: IMARPE anchoveta biomass surveys and quota decisions
    variables: [biomass, quota]

markets:
  worldbank_pinksheet:
    connector: worldbank_pinksheet
    auth: none
    url: https://thedocs.worldbank.org/en/doc/5d903e848db1d1b83e0ec8f744e55570-0350012021/related/CMO-Historical-Data-Monthly.xlsx
    cadence: "0 12 2 * *"
    description: World Bank Pink Sheet monthly nominal commodity prices
    units: usd
    variables: [price]

  yahoo_futures:
    connector: yahoo_futures
    auth: none
    url: https://query1.finance.yahoo.com/v8/finance/chart/
    cadence: "*/30 13-21 * * 1-5"
    description: Continuous front-month futures settlements
    units: native
    variables: [close, volume]

  twelve_data:
    connector: generic_http_json
    auth: key
    env: [TWELVE_DATA_KEY]
    url: https://api.twelvedata.com/time_series
    cadence: "*/15 * * * 1-5"
    description: Backup/intraday market feed
    variables: [close]

  cme_settlements:
    connector: generic_http_json
    auth: key
    env: [CME_API_KEY]
    url: https://www.cmegroup.com/services/
    cadence: "0 22 * * 1-5"
    description: CBOT/CME official settlements and forward curve
    variables: [settle, open_interest]

  ice_settlements:
    connector: generic_http_json
    auth: key
    env: [ICE_API_KEY]
    url: https://www.theice.com/marketdata/
    cadence: "0 22 * * 1-5"
    description: ICE softs (coffee, cocoa, sugar) settlements
    variables: [settle]

  bursa_malaysia:
    connector: generic_http_json
    auth: key
    env: [BURSA_API_KEY]
    url: https://www.bursamalaysia.com/
    cadence: "0 11 * * 1-5"
    description: FCPO crude palm oil futures
    units: myr
    variables: [settle]

food_security:
  ipc:
    connector: generic_http_json
    auth: none
    url: https://www.ipcinfo.org/
    cadence: "0 06 3 * *"
    description: IPC/CH acute food insecurity phase classifications
    variables: [phase, population_affected]

  fews_net:
    connector: generic_http_json
    auth: none
    url: https://fews.net/
    cadence: "0 06 * * 4"
    description: FEWS NET outlooks
    variables: [phase_projection]
