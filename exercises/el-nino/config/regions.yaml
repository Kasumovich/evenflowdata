# ---------------------------------------------------------------------------
# Region registry + teleconnection composites.
#
# Every entry is a *composite response calibrated on strong El Nino events*
# (reference intensity ONI ~ 2.4 degC, i.e. the 1997-98 class). The impact
# engine scales these by (event / reference) ** damping -- see thresholds.yaml.
# It does NOT invent country data: the sign and rough magnitude of each
# response come from the teleconnection literature and agency composites cited
# in docs/DATA_DICTIONARY.md. Values are explicitly `provenance: composite`
# and are shown as such in every dashboard hover card.
#
# precip_djf / precip_mam : % departure from 1991-2020 seasonal total
# temp_djf                : degC departure from 1991-2020
# fire_risk               : 0-1 index contribution before intensity scaling
# confidence              : 0-1 prior on teleconnection reliability for this region
#
# ADD A COUNTRY: append a block. Nothing else changes.
# ---------------------------------------------------------------------------
version: 3

pinned_by_default: [PER, IDN]

# `dominant_signal` is the expected sign of the precipitation response, used
# only for grouping and narrative ordering -- never for colour, which always
# comes from the value itself via the diverging scale.
groups:
  andes_pacific:    { label: "Andean / Pacific South America", dominant_signal: mixed }
  maritime_se_asia: { label: "Maritime Southeast Asia",        dominant_signal: dry }
  oceania:          { label: "Australia / Pacific",            dominant_signal: dry }
  southern_africa:  { label: "Southern Africa",                dominant_signal: dry }
  east_africa:      { label: "Horn / East Africa",             dominant_signal: wet }
  south_asia:       { label: "South Asia",                     dominant_signal: dry }
  mainland_sea:     { label: "Mainland Southeast Asia",        dominant_signal: dry }
  central_america:  { label: "Central America / Caribbean",    dominant_signal: dry }
  north_america:    { label: "North America",                  dominant_signal: wet }
  south_america_e:  { label: "Eastern South America",          dominant_signal: mixed }
  west_africa:      { label: "West Africa",                    dominant_signal: mixed }

countries:

  - iso3: PER
    name: Peru
    group: andes_pacific
    precip_djf: 95.0
    precip_mam: 55.0
    temp_djf: 1.4
    fire_risk: 0.15
    confidence: 0.86
    hazards: [coastal_flooding, landslides, huaico, fishery_collapse, andean_drought]
    notes: >
      Dual-signed, and the national figure understates both halves. Coastal
      north (Piura, Lambayeque, Tumbes) can see several times normal rainfall
      -- 1997-98 delivered order-of-magnitude departures there -- while the
      southern Andean altiplano dries, hitting potato and quinoa. The value
      shown is a national DJF mean; read the coastal hazard, not the average.
      Anchoveta biomass is the single most El-Nino-elastic commodity series
      on the planet.
    fisheries:
      species: anchoveta
      # Verified: 1997-98 (ONI 2.4, the reference intensity) took biomass from
      # 5.8 Mt to 1.2 Mt. The previous -58 was an estimate; this is the
      # observation. Scaled as a depletion process, not linearly -- see
      # thresholds.yaml `fisheries`.
      biomass_anom_pct: -79.0
      biomass_anom_provenance: verified
      biomass_anom_source: "ICES J. Mar. Sci., anchoveta phenological mismatch"
      quota_risk: severe
      ref_event_1997_98_catch_drop_pct: -78.0
    crops:
      rice:   { exposure: 0.30, sensitivity: -0.07 }
      maize:  { exposure: 0.20, sensitivity: -0.163 }
      coffee: { exposure: 0.15, sensitivity: -0.104 }
      potato: { exposure: 0.35, sensitivity: -0.2 }

