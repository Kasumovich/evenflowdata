[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enso-tracker"
version = "1.0.0"
description = "Production tracking dashboard for the 2026-27 El Nino event and its agricultural/commodity exposure"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "requests>=2.31",
  "pyarrow>=15.0",
  "openpyxl>=3.1",
  "duckdb>=1.0",
  "plotly>=5.22",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
orchestration = ["prefect>=3.0"]
geo = [
  "xarray>=2024.3", "netCDF4>=1.6", "dask>=2024.4",
  "geopandas>=1.0", "rasterio>=1.3", "cdsapi>=0.7", "zarr>=2.17",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
enso-tracker = "enso_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"
