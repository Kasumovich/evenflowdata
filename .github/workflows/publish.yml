name: Refresh El Nino tracker

# Cloudflare Pages is Git-connected to this repo with automatic deployments, so
# this workflow does NOT deploy. It refreshes the tracker and commits the built
# output to `site/`; Cloudflare sees the push and publishes.
#
# GitHub Actions is here purely for the schedule. Cloudflare Pages builds on
# push and cannot refresh twice daily on its own. The runner also has the
# network egress needed to reach NOAA, the World Bank and the exchanges, which
# is what promotes every figure from the bundled seed snapshot to live data.
on:
  schedule:
    - cron: "0 6,18 * * *"      # 06:00 and 18:00 UTC
  workflow_dispatch:
    inputs:
      allow_seeded:
        description: "Publish even if no source went live (normally blocked)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "exercises/el-nino/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write        # commit the built site + point-in-time archive

# Never overlap with itself, and never race the Beige Book's update.yml, which
# also pushes to main.
concurrency:
  group: site-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercises/el-nino

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: exercises/el-nino/pyproject.toml

      # `forecast` adds cdsapi + xarray + netCDF4, which is what lets the
      # Copernicus connectors run at all. They stay dormant without a
      # CDSAPI_KEY secret, so this costs ~30s of install and nothing else
      # until the credential exists.
      - name: Install
        run: pip install -e ".[dev,forecast]"

      - name: Validate configuration
        run: enso-tracker validate

      - name: Test
        run: pytest -q

      - name: Show source readiness
        run: enso-tracker sources

      # Every credential here is optional. The run succeeds without them and
      # the dashboard states which layers stayed composite-derived.
      - name: Run pipeline (Steps A-F)
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          ADSAPI_URL: ${{ secrets.ADSAPI_URL }}
          ADSAPI_KEY: ${{ secrets.ADSAPI_KEY }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          USDA_NASS_KEY: ${{ secrets.USDA_NASS_KEY }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          ENSO_ALERT_WEBHOOK: ${{ secrets.ENSO_ALERT_WEBHOOK }}
        run: enso-tracker all --in-docs --no-pdf

      # Publish gate.
      #
      # v1 asked only "did any source go live?". Three did, so the first real
      # run passed -- and shipped a dashboard whose Nino 3.4 reading was six
      # years old, because the two sources that drive the headline were not
      # among the three. A count is not a check.
      #
      # v2 checked the age of those two instead, and was wrong the other way:
      # CPC's own ONI table can sit months behind its normal cadence while the
      # connector reads it perfectly. Age alone cannot tell "we could not reach
      # the source" from "we reached it, and this is genuinely the newest
      # season it has published" -- and only the first is a reason to withhold
      # the page.
      #
      # So the gate asks both questions separately:
      #   1. was each headline dataset read from its primary source?
      #      -- if not, we are publishing a snapshot dressed as a tracker.
      #   2. is what that source served absurdly old?
      #      -- catches the frozen-file case (2,274 days) without punishing a
      #         slow-but-working publisher. Ordinary lateness is the dashboard's
      #         stale-observation alert to report, not the gate's to block.
      #
      # It reads provenance from whichever field the running pipeline exposes,
      # so it behaves identically before and after the pipeline change lands.
      # Half-applied updates have cost us two runs already.
      - name: Gate on live data
        if: ${{ github.event.inputs.allow_seeded != 'true' }}
        run: |
          python - <<'PY'
          import json, sys, yaml

          CRITICAL = ["oni_observed", "weekly_nino"]
          STATE_KEY = {"oni_observed": "oni", "weekly_nino": "weekly"}
          ABSURD_DAYS = 365     # no primary climate feed is legitimately this stale

          limits = yaml.safe_load(open("config/thresholds.yaml"))["alerts"]["observation_age_h"]
          p = json.load(open("output/dashboard_payload.json"))
          meta, state = p["meta"], p["state"]
          ages = meta.get("observation_age_h", {})

          def tier(dataset):
              """Prefer the per-dataset map; fall back to the state block, which
              every version of the pipeline has emitted."""
              direct = meta.get("dataset_provenance", {}).get(dataset)
              if direct:
                  return str(direct)
              return str(state.get("provenance", {}).get(STATE_KEY[dataset], "missing"))

          print(f"live={meta['sources_live']} seeded={meta['sources_seeded']} "
                f"dormant={meta['sources_dormant']} failed={meta['sources_failed']}")

          problems, notes = [], []
          for dataset in CRITICAL:
              t, age = tier(dataset), ages.get(dataset)
              shown = "unknown age" if age is None else f"{age/24:.0f} days old"

              if not t.startswith("live"):
                  problems.append(
                      f"{dataset}: not read from its primary source this run "
                      f"(served from {t}, {shown})"
                  )
                  continue
              if age is None:
                  problems.append(f"{dataset}: live but will not state an observation date")
                  continue
              if age > ABSURD_DAYS * 24:
                  problems.append(
                      f"{dataset}: primary source answered but served data "
                      f"{age/24:.0f} days old -- almost certainly a frozen file"
                  )
                  continue

              print(f"OK  {dataset}: {t}, {shown}")
              # Merely late, not absurd: publish it and say so. Same limits the
              # in-dashboard alarm uses, so the gate and the page cannot
              # disagree about what counts as stale.
              spec = limits.get(dataset) or limits["default"]
              if spec and age > float(spec["critical"]):
                  notes.append(f"{dataset} is {age/24:.0f} days old, past its "
                               f"{float(spec['critical'])/24:.0f}-day critical limit")

          if problems:
              sys.exit(
                  "Refusing to publish. The tracker's headline cannot be trusted:\n  - "
                  + "\n  - ".join(problems)
                  + "\n\nFix the source, or re-run with allow_seeded=true to publish "
                    "deliberately with these known gaps."
              )

          for n in notes:
              print(f"NOTE {n}. Publishing with the stale-observation alert raised.")
          PY

      # Publish, then commit.
      #
      # This used to stage into site/, commit, then `git pull --rebase`. The
      # Beige Book's own workflow pushes to the same branch, and when it landed
      # first the rebase tried to merge two generated payloads line by line.
      # Every file conflicted, the rebase stopped mid-flight, the job ended on a
      # detached HEAD and nothing was ever pushed -- so the site silently froze
      # while the runs kept going green-then-red for reasons nobody was reading.
      #
      # Generated artifacts must never be merged. There is no meaningful
      # three-way merge of two dashboards built from different runs; the newer
      # one simply wins. So we hold the outputs aside, move to whatever main is
      # now, lay them down on top, and push -- retrying if we lose another race.
      - name: Commit and let Cloudflare deploy
        working-directory: .
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          HOLD=$(mktemp -d)

          cp exercises/el-nino/output/dashboard.html         "$HOLD/index.html"
          cp exercises/el-nino/output/dashboard_payload.json "$HOLD/payload.json"
          cp exercises/el-nino/docs/sitreps/sitrep_*.md      "$HOLD/" 2>/dev/null || true

          git config user.name  "elnino-bot"
          git config user.email "bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            # -f because the working tree is disposable: everything we intend
            # to publish is already in $HOLD. Without it the checkout aborts,
            # since the pipeline rewrites docs/sitreps/ in place and git will
            # not move a branch over locally-modified tracked files.
            git checkout -f -B main origin/main

            mkdir -p site/el-nino exercises/el-nino/archive exercises/el-nino/docs/sitreps
            cp "$HOLD/index.html"   site/el-nino/index.html
            cp "$HOLD/payload.json" site/el-nino/payload.json
            cp "$HOLD/payload.json" "exercises/el-nino/archive/payload_${STAMP}.json"
            for f in "$HOLD"/sitrep_*.md; do
              [ -e "$f" ] || continue
              cp "$f" site/el-nino/
              cp "$f" exercises/el-nino/docs/sitreps/
            done

            git add site/el-nino exercises/el-nino/archive exercises/el-nino/docs/sitreps

            if git diff --cached --quiet; then
              echo "no change -- nothing to deploy"
              exit 0
            fi

            git commit -m "el-nino: refresh ${STAMP}"
            if git push origin main; then
              echo "pushed on attempt ${attempt}; Cloudflare will deploy"
              exit 0
            fi
            echo "lost a push race on attempt ${attempt}, rebuilding on new main"
          done

          echo "::error::could not push after 3 attempts"
          exit 1

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open("output/dashboard_payload.json"))
          s, m = p["state"], p["meta"]
          print("## El Nino tracker refreshed\n")
          print(f"- Peak median **{s['peak_median']:.1f} degC** "
                f"({s['peak_p10']:.1f}-{s['peak_p90']:.1f})")
          print(f"- Observed ONI **{s['current_oni']:+.1f}** ({s['current_oni_season']}), "
                f"{s['days_to_peak']} days to peak")
          print(f"- Sources: {m['sources_live']} live, {m['sources_seeded']} seeded, "
                f"{m['sources_dormant']} dormant, {m['sources_failed']} failed\n")
          c = m.get("alert_counts", {})
          print(f"### Alerts: {c.get('incident',0)} incident, "
                f"{c.get('standing',0)} standing, {c.get('configuration',0)} config\n")
          for a in p.get("alerts", []):
              print(f"- **[{a['severity']}]** {a['title']}")
          PY

# ---------------------------------------------------------------------------
# No Cloudflare credentials are needed.
#
# The Pages project is Git-connected with automatic deployments, so pushing to
# main IS the deploy. A `wrangler pages deploy` direct upload would fight that
# integration rather than complement it.
#
# Optional repository secrets, all for data sources rather than hosting:
#   CDSAPI_KEY / CDSAPI_URL     Copernicus C3S + ERA5 -> gridded precip & temp
#   ADSAPI_KEY / ADSAPI_URL     CAMS GFAS             -> observed fire activity
#   EARTHDATA_TOKEN             MODIS NDVI / VHI      -> vegetation stress
#   USDA_NASS_KEY               USDA QuickStats       -> yields and area
#   TWELVE_DATA_KEY             intraday market backup
#   ENSO_ALERT_WEBHOOK          POST target for incident-tier alerts only
# ---------------------------------------------------------------------------
